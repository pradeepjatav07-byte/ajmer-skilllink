<line x1="1274" y1="430" x2="1372" y2="430" class="arrow"/>
<rect x="80" y="685" width="1440" height="105" rx="14" fill="#0f2038" stroke="#2b4a78" stroke-width="2"/>
<text x="100" y="715" class="n">• Smart features: search/filter, FairQuote, booking timeline, one-second notification polling, admin charts.</text>
<text x="100" y="743" class="n">• Security: BCrypt hashes, JWT access tokens, rotating refresh-token hashes, role checks, global error responses.</text>
<text x="100" y="771" class="n">• Tests: H2 in-memory test profile with Flyway disabled; MySQL + Flyway used for normal local persistence.</text>
