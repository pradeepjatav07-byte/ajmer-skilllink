spring:
  datasource:
    url: jdbc:h2:mem:skilllink;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
app:
  jwt:
    # Test-only deterministic key. It is not used by any running deployment.
    secret-base64: QVNMX1RFU1RfT05MWV9LRVlfMDAwMDAwMDAwMDAwMDA=
    access-minutes: 20
    refresh-days: 30
  cors:
    allowed-origins: http://localhost:5173
