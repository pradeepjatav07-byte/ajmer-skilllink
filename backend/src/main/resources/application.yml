server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: ajmer-skilllink-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ajmer_skilllink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:skilllink}
    password: ${DB_PASSWORD:skilllink_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret-base64: ${SKILLLINK_JWT_SECRET_BASE64:c2tpbGxsaW5rLWRldi1zZWNyZXQtMzItYnl0ZXMtZm9yLWhzMjU2LWtleS1vbmU=}
    access-minutes: ${JWT_ACCESS_MINUTES:20}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging:
  level:
    root: INFO
    com.nexoraa.skilllink: INFO
    org.springframework.security: WARN
